# Platform defaults, loaded at lowest precedence by PlatformDefaultsPostProcessor.
# Services override any key via application.yml or environment variables.
logging.structured.format.console=dev.platform.starter.logging.PlatformLogFormatter

# Web / health probes (/health/live, /health/ready). The ready group always lists "db"; group
# membership is not validated, so services without a DataSource simply have no "db" member.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState,db
management.endpoint.health.validate-group-membership=false
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true
