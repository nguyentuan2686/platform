# Platform defaults, loaded at lowest precedence by PlatformDefaultsPostProcessor.
# Services override any key via application.yml or environment variables.
logging.structured.format.console=dev.platform.starter.logging.PlatformLogFormatter

# Web / health probes (/health/live, /health/ready). The "db" member of the ready group is added
# by PlatformDefaultsPostProcessor only when a JDBC health indicator is on the classpath.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true
