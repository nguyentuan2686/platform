openapi: 3.1.0
info:
  title: chart-svc
  version: 1.0.0
  description: >-
    Stateless Tu Vi (Zi Wei Dou Shu) chart service. Pure function: the same request always
    yields byte-identical JSON. Stable keys (branches, stems, palaces, stars, mutagens,
    brightness, elements) are ASCII and never translated; every key has a Vietnamese label
    (nameVi). Supported years are 1900-2100. Birth time is normalised from the birth zone's
    historical offset to the calendar's standard offset (VN +7, CN +8); a birth at 23:00-23:59
    counts as the next solar day, hour branch Zi.
paths:
  /tuvi/chart:
    post:
      operationId: castChart
      summary: Cast the natal chart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartRequest'
      responses:
        '200':
          description: The natal chart. Palaces are ordered by branch starting at Yin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chart'
        '400':
          description: >-
            Invalid request; errors[0].field is one of body, birth, zone, gender, calendar.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /tuvi/daily:
    post:
      operationId: castDaily
      summary: Flow (yearly, monthly, daily) of a day for a natal chart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRequest'
      responses:
        '200':
          description: The flow layers of the requested day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Daily'
        '400':
          description: >-
            Invalid request; errors[0].field is one of body, birth, zone, gender, calendar,
            date.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    ChartRequest:
      type: object
      required: [birth, gender]
      properties:
        birth:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?$'
          description: Local civil time in `zone`, YYYY-MM-DDTHH:MM with optional :SS and no offset.
          examples: ['1994-03-12T08:30']
        zone:
          type: string
          default: Asia/Ho_Chi_Minh
          description: IANA time zone of the birth place.
        gender:
          type: string
          enum: [male, female]
        calendar:
          type: string
          enum: [VN, CN]
          default: VN
          description: Lunar calendar (VN computed at UTC+7, CN at UTC+8).
    DailyRequest:
      allOf:
        - $ref: '#/components/schemas/ChartRequest'
        - type: object
          required: [date]
          properties:
            date:
              type: string
              format: date
              description: Solar day to cast, YYYY-MM-DD, years 1900-2100.
              examples: ['2026-11-25']
    Lunar:
      type: object
      required: [year, month, day, leap]
      additionalProperties: false
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 30
        leap:
          type: boolean
    CanChi:
      type: object
      required: [stem, branch, nameVi]
      additionalProperties: false
      properties:
        stem:
          $ref: '#/components/schemas/Stem'
        branch:
          $ref: '#/components/schemas/Branch'
        nameVi:
          type: string
          minLength: 1
    Stem:
      type: string
      enum: [Jia, Yi, Bing, Ding, Wu, Ji, Geng, Xin, Ren, Gui]
    Branch:
      type: string
      enum: [Zi, Chou, Yin, Mao, Chen, Si, Wu, Wei, Shen, You, Xu, Hai]
    PalaceKey:
      type: string
      enum: [Menh, PhuMau, PhucDuc, DienTrach, QuanLoc, NoBoc, ThienDi, TatAch, TaiBach, TuTuc, PhuThe, HuynhDe]
    StarKey:
      type: string
      enum:
        - TuVi
        - ThienCo
        - ThaiDuong
        - VuKhuc
        - ThienDong
        - LiemTrinh
        - ThienPhu
        - ThaiAm
        - ThamLang
        - CuMon
        - ThienTuong
        - ThienLuong
        - ThatSat
        - PhaQuan
        - TaPhu
        - HuuBat
        - VanXuong
        - VanKhuc
        - LocTon
        - ThienMa
        - KinhDuong
        - DaLa
        - HoaTinh
        - LinhTinh
        - DiaKhong
        - DiaKiep
        - ThienKhoi
        - ThienViet
    Mutagen:
      type: string
      enum: [Loc, Quyen, Khoa, Ky]
    Brightness:
      type: string
      enum: [Mieu, Vuong, Dac, Binh, Ham]
    Element:
      type: string
      enum: [Thuy, Moc, Kim, Tho, Hoa]
    Star:
      type: object
      required: [key, nameVi, brightness, mutagen]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/StarKey'
        nameVi:
          type: string
          minLength: 1
        brightness:
          description: Null for stars without a brightness.
          oneOf:
            - $ref: '#/components/schemas/Brightness'
            - type: 'null'
        mutagen:
          description: Birth-year transformation (Tu Hoa) of the star, if any.
          oneOf:
            - $ref: '#/components/schemas/Mutagen'
            - type: 'null'
    Palace:
      type: object
      required: [key, nameVi, branch, stem, isBody, decade, major, minor]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/PalaceKey'
        nameVi:
          type: string
          minLength: 1
        branch:
          $ref: '#/components/schemas/Branch'
        stem:
          $ref: '#/components/schemas/Stem'
        isBody:
          type: boolean
          description: True for the palace that holds Than (the body); exactly one palace.
        decade:
          type: object
          required: [from, to]
          additionalProperties: false
          description: Dai han, ages from..to inclusive.
          properties:
            from:
              type: integer
              minimum: 0
            to:
              type: integer
              minimum: 0
        major:
          type: array
          items:
            $ref: '#/components/schemas/Star'
        minor:
          type: array
          items:
            $ref: '#/components/schemas/Star'
    Chart:
      type: object
      required:
        - school
        - calendar
        - lunar
        - yearCanChi
        - hourBranch
        - cuc
        - menhChu
        - thanChu
        - thanPalace
        - palaces
      additionalProperties: false
      properties:
        school:
          type: string
          enum: [iztro-default+vn-calendar, iztro-default]
          description: iztro-default+vn-calendar for calendar VN, iztro-default for CN.
        calendar:
          type: string
          enum: [VN, CN]
        lunar:
          $ref: '#/components/schemas/Lunar'
        yearCanChi:
          $ref: '#/components/schemas/CanChi'
        hourBranch:
          $ref: '#/components/schemas/Branch'
        cuc:
          type: object
          required: [element, number, nameVi]
          additionalProperties: false
          properties:
            element:
              $ref: '#/components/schemas/Element'
            number:
              type: integer
              minimum: 2
              maximum: 6
            nameVi:
              type: string
              minLength: 1
        menhChu:
          $ref: '#/components/schemas/StarKey'
        thanChu:
          $ref: '#/components/schemas/StarKey'
        thanPalace:
          $ref: '#/components/schemas/PalaceKey'
        palaces:
          type: array
          minItems: 12
          maxItems: 12
          description: Ordered by branch starting at Yin, the order the board is drawn in.
          items:
            $ref: '#/components/schemas/Palace'
    FlowLayer:
      type: object
      required: [palaceKey, branch, stem, mutagens]
      additionalProperties: false
      properties:
        palaceKey:
          $ref: '#/components/schemas/PalaceKey'
        branch:
          $ref: '#/components/schemas/Branch'
        stem:
          $ref: '#/components/schemas/Stem'
        mutagens:
          type: array
          minItems: 4
          maxItems: 4
          description: The stem's Tu Hoa in the order Loc, Quyen, Khoa, Ky.
          items:
            type: object
            required: [star, mutagen]
            additionalProperties: false
            properties:
              star:
                $ref: '#/components/schemas/StarKey'
              mutagen:
                $ref: '#/components/schemas/Mutagen'
    Daily:
      type: object
      required: [date, lunar, dayCanChi, yearly, monthly, daily]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        lunar:
          $ref: '#/components/schemas/Lunar'
        dayCanChi:
          $ref: '#/components/schemas/CanChi'
        yearly:
          $ref: '#/components/schemas/FlowLayer'
        monthly:
          $ref: '#/components/schemas/FlowLayer'
        daily:
          $ref: '#/components/schemas/FlowLayer'
    Problem:
      type: object
      description: RFC 9457 problem details with platform extensions.
      required: [type, title, status, trace_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
