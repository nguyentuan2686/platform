<!doctype html>
<html lang="vi" data-site="tuvi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype v2 — Tử vi &amp; Chiêm tinh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Display:wght@500;700&family=Ma+Shan+Zheng&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Charm:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* ---------- theme tokens ---------- */
:root[data-site="tuvi"]{
  --bg:#1A0A08; --bg2:#2B110D; --panel:#24100C;
  --accent:#A8231B;   /* son */
  --metal:#C8A04A;    /* vàng lá */
  --metal-soft:#E9D49A;
  --paper:#F1E6CC; --ink:#2B1E16; --ink-soft:#6B5640;
  --good:#4E7A64; --text:#F1E6CC; --muted:#B69C76;
  --display:"Charm", "Noto Serif", serif; --plain:"Noto Serif Display", "Noto Serif", serif; --title-weight:700;
  --body:"Noto Serif", serif;
  --glyph:"Ma Shan Zheng", serif;
  --radius-lg:6px; --radius-sm:3px;
}
:root[data-site="astro"]{
  --bg:#0B1026; --bg2:#141B3D; --panel:#111735;
  --accent:#D79AA6;   /* hồng tinh vân */
  --metal:#D2AE63;    /* đồng thau */
  --metal-soft:#EAD7A4;
  --paper:#ECE6D6; --ink:#1B1F3A; --ink-soft:#56597A;
  --good:#9FB7E8; --text:#ECE6D6; --muted:#9A9CC0;
  --display:"Great Vibes", "Cormorant Garamond", serif; --plain:"Cormorant Garamond", serif; --title-weight:400;
  --body:"Spectral", serif;
  --glyph:"Cormorant Garamond", serif;
  --radius-lg:22px; --radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#141414;color:#e8e2d4;font-family:"Be Vietnam Pro",sans-serif;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--metal);outline-offset:2px}

/* ---------- workbench (outside the phone) ---------- */
.bench{display:grid;grid-template-columns:220px 1fr 300px;gap:28px;min-height:100%;padding:28px;max-width:1240px;margin:0 auto}
.rail h1{font-family:"Noto Serif Display",serif;font-size:20px;font-weight:500;color:#f3ead6;margin-bottom:4px}
.rail p{color:#9c9686;font-size:12.5px;line-height:1.5;margin-bottom:18px}
.switch{display:flex;border:1px solid #3a3a3a;border-radius:8px;overflow:hidden;margin-bottom:22px}
.switch button{flex:1;padding:9px 0;font-size:13px;color:#aaa}
.switch button[aria-pressed="true"]{background:#f1e6cc;color:#1a0a08;font-weight:500}
.screens{list-style:none;display:flex;flex-direction:column;gap:2px}
.screens button{width:100%;text-align:left;padding:8px 10px;border-radius:6px;color:#bdb7a8;font-size:13.5px}
.screens button[aria-current="true"]{background:#262626;color:#fff}
.stage{display:flex;justify-content:center;align-items:flex-start}
.notes{font-size:13px;line-height:1.6;color:#c9c3b3}
.notes h2{font-family:"Noto Serif Display",serif;font-size:16px;font-weight:500;color:#f3ead6;margin-bottom:10px}
.notes h3{font-size:13px;font-weight:500;color:#f3ead6;margin:16px 0 6px}
.notes ul{padding-left:18px}
.notes li{margin-bottom:6px}
.notes .q{background:#202020;border-left:3px solid #c8a04a;padding:10px 12px;border-radius:4px;margin-top:6px}
@media (max-width:1000px){
  .bench{grid-template-columns:1fr;padding:16px;gap:18px}
  .notes{order:3}
}

/* ---------- phone ---------- */
.phone{width:390px;max-width:100%;height:812px;border-radius:46px;padding:10px;background:#050505;box-shadow:0 0 0 1px #2c2c2c,0 30px 80px rgba(0,0,0,.55)}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.status{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:12px;font-family:"Be Vietnam Pro",sans-serif;color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px}
.brand{font-family:var(--display);font-size:19px;color:var(--metal-soft);letter-spacing:.01em}
.credits{font-size:12.5px;color:var(--metal-soft);border:1px solid color-mix(in srgb,var(--metal) 45%,transparent);border-radius:999px;padding:4px 10px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid color-mix(in srgb,var(--metal) 22%,transparent);background:var(--bg);padding:8px 6px 20px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
.tabbar button[aria-current="true"]{color:var(--metal-soft)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}

/* shared pieces */
.pad{padding:0 20px 28px}
.h-display{font-family:var(--display);font-weight:500;line-height:1.15;color:var(--paper)}
.lead{color:var(--muted);line-height:1.65;font-size:14.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;background:var(--accent);color:#fff8ec}
:root[data-site="astro"] .btn{background:var(--metal);color:#14183a}
.btn.ghost, :root[data-site] .btn.ghost{background:transparent;border:1px solid color-mix(in srgb,var(--metal) 55%,transparent);color:var(--metal-soft)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted)}
.field .in{border:1px solid color-mix(in srgb,var(--metal) 35%,transparent);background:color-mix(in srgb,var(--bg2) 80%,transparent);border-radius:var(--radius-sm);padding:12px 13px;font-size:15px;color:var(--paper)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg span{flex:1;text-align:center;padding:11px 0;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--metal) 35%,transparent);color:var(--muted);font-size:14px}
.seg span.on{border-color:var(--metal);color:var(--metal-soft);background:color-mix(in srgb,var(--metal) 12%,transparent)}
.fine{font-size:12px;color:var(--muted);line-height:1.55}
.sheet{background:var(--paper);color:var(--ink);border-radius:var(--radius-lg)}
.section-gap{height:22px}

/* ---------- tử vi: lacquer board ---------- */
.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);aspect-ratio:1/1.12;
  background:linear-gradient(160deg,#3A140F,#220B08 60%,#2E100C);border:2px solid var(--metal);padding:3px;gap:2px;
  box-shadow:inset 0 0 0 1px #5e3a1c,0 18px 40px rgba(0,0,0,.45)}
.cell{position:relative;background:linear-gradient(180deg,rgba(255,240,210,.04),rgba(0,0,0,.12));border:1px solid rgba(200,160,74,.38);padding:5px 5px 4px;display:flex;flex-direction:column;min-width:0}
.cell .pn{font-size:10.5px;color:var(--metal);font-weight:600;letter-spacing:.02em}
.cell .chi{position:absolute;right:4px;bottom:3px;font-size:9px;color:#9a7f5b}
.cell .stars{margin-top:3px;display:flex;flex-direction:column;gap:1px}
.cell .st{font-size:10.5px;color:var(--paper);line-height:1.25;white-space:nowrap}
.cell .st b{font-weight:400;color:#c9a96a;font-size:8.5px;margin-left:2px}
.cell .minor{font-size:9px;color:#a58d6c;line-height:1.3;margin-top:2px}
.cell .hoa{display:inline-block;font-size:8.5px;background:var(--accent);color:#fff2dc;padding:0 3px;border-radius:2px;margin-left:3px;vertical-align:1px}
.cell.menh{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.menh .pn{color:#f0c27a}
.cell.pick{outline:2px solid var(--metal-soft);outline-offset:-2px}
.center{grid-column:2/4;grid-row:2/4;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border:1px solid rgba(200,160,74,.5);background:radial-gradient(circle at 50% 45%,#3d1610,#1d0907 75%);overflow:hidden;padding:8px}
.center .seal{position:absolute;font-family:var(--glyph);font-size:150px;line-height:1;color:rgba(168,35,27,.28);top:50%;left:50%;transform:translate(-50%,-52%)}
.center .nm{position:relative;font-family:var(--display);font-size:16px;color:var(--paper)}
.center .meta{position:relative;font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:4px}
.center .cuc{position:relative;margin-top:6px;font-size:10.5px;color:var(--metal-soft)}

/* home hero (tử vi) */
.tv-hero{position:relative;padding:8px 20px 0;min-height:250px}
.tv-hero .vert{position:absolute;right:14px;top:0;writing-mode:vertical-rl;font-family:var(--glyph);font-size:64px;line-height:1;color:rgba(200,160,74,.22);letter-spacing:.06em}
.tv-hero h2{font-size:34px;max-width:270px;margin-top:22px}
.tv-hero .lead{max-width:270px;margin-top:12px}
.stamp{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--accent);color:#ffe9c8;font-family:var(--glyph);font-size:20px;border-radius:3px;transform:rotate(-4deg)}
.slip{margin:22px 20px 0;padding:18px 16px 16px;background:linear-gradient(180deg,#2A110D,#200C09);border:1px solid rgba(200,160,74,.45);border-radius:var(--radius-lg);position:relative}
.slip::before{content:"";position:absolute;inset:4px;border:1px solid rgba(200,160,74,.18);pointer-events:none;border-radius:4px}

/* ---------- chiêm tinh: sky ---------- */
.sky{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(1px 1px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 78% 9%,#fff9,transparent),
  radial-gradient(1.5px 1.5px at 64% 32%,#fffb,transparent),radial-gradient(1px 1px at 30% 44%,#fff6,transparent),
  radial-gradient(1px 1px at 88% 52%,#fff7,transparent),radial-gradient(1.5px 1.5px at 20% 70%,#fff9,transparent),
  radial-gradient(1px 1px at 52% 84%,#fff6,transparent),radial-gradient(1px 1px at 92% 88%,#fff8,transparent),
  radial-gradient(120% 60% at 80% 0%,rgba(123,107,196,.28),transparent 60%),
  radial-gradient(90% 50% at 0% 100%,rgba(215,154,166,.14),transparent 60%)}
.as-hero{position:relative;padding:4px 20px 0;min-height:330px;overflow:hidden}
.as-hero svg.arc{position:absolute;right:-215px;top:-150px;width:400px;height:400px;opacity:.7}
.as-hero h2{position:relative;font-size:40px;font-style:italic;max-width:250px;margin-top:150px;font-weight:500}
.as-hero .lead{position:relative;max-width:240px;margin-top:12px}
:root[data-site="astro"] .slip{background:rgba(20,27,61,.72);backdrop-filter:blur(6px);border-color:rgba(210,174,99,.35)}
:root[data-site="astro"] .slip::before{display:none}
.wheel-wrap{position:relative;display:flex;justify-content:center;padding:6px 0 4px}
.wheel-wrap svg{width:100%;max-width:350px;height:auto}

/* ---------- reading / lists ---------- */
.paper{background:var(--paper);color:var(--ink);border-radius:var(--radius-lg);padding:20px 18px;line-height:1.75;font-size:15px;position:relative}
:root[data-site="tuvi"] .paper{background:linear-gradient(180deg,#F3E8CF,#EADBB8);border-radius:4px}
.paper h3{font-family:var(--display);font-size:20px;font-weight:500;line-height:1.3;margin-bottom:10px}
.paper p+p{margin-top:12px}
.paper .ask{font-style:italic;color:var(--ink-soft);border-left:3px solid var(--accent);padding-left:10px;margin-bottom:14px;font-size:14px}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{border:1px solid color-mix(in srgb,var(--metal) 35%,transparent);border-radius:var(--radius-sm);padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:color-mix(in srgb,var(--bg2) 70%,transparent)}
.topic .tn{font-family:var(--display);font-size:17px;color:var(--paper)}
.topic .tx{font-size:11.5px;color:var(--muted);line-height:1.4}
.topic .gl{font-family:var(--glyph);font-size:22px;color:var(--metal);line-height:1}
.topic.on{border-color:var(--metal);background:color-mix(in srgb,var(--metal) 14%,var(--bg2))}
.textarea{min-height:88px;line-height:1.5}
.pack{display:flex;align-items:center;justify-content:space-between;border:1px solid color-mix(in srgb,var(--metal) 35%,transparent);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px}
.pack .pl{font-family:var(--display);font-size:20px;color:var(--paper)}
.pack .ps{font-size:12px;color:var(--muted)}
.pack .pp{font-size:16px;color:var(--metal-soft);text-align:right}
.pack .pp small{display:block;font-size:11px;color:var(--muted)}
.pack.on{border-color:var(--metal);background:color-mix(in srgb,var(--metal) 12%,transparent)}
.qr{width:180px;height:180px;margin:0 auto;background:#fff;padding:10px;border-radius:8px}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid color-mix(in srgb,var(--metal) 18%,transparent)}
.list-item .t{color:var(--paper);font-size:14.5px}
.list-item .s{color:var(--muted);font-size:12px;margin-top:2px}
.list-item .r{color:var(--metal-soft);font-size:12.5px;white-space:nowrap}
.profile{border:1px solid color-mix(in srgb,var(--metal) 40%,transparent);border-radius:var(--radius-lg);padding:16px;position:relative}
.profile .nm{font-family:var(--display);font-size:22px;color:var(--paper)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{color:var(--paper)}
.lock{margin-top:12px;font-size:12px;color:var(--metal-soft);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.share-card{width:210px;margin:0 auto;aspect-ratio:9/16;border-radius:14px;overflow:hidden;position:relative;background:var(--bg2);border:1px solid var(--metal);display:flex;flex-direction:column;padding:14px 12px}
.share-card .sc-t{font-family:var(--display);color:var(--paper);font-size:15px;line-height:1.3;margin-top:auto}
.share-card .sc-b{font-size:10px;color:var(--muted);margin-top:8px}
.channels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:20px}
.channels button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.channels i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid color-mix(in srgb,var(--metal) 45%,transparent);font-style:normal;color:var(--metal-soft);font-size:13px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--metal) 18%,transparent)}
.toggle .sw{flex:none;width:42px;height:24px;border-radius:12px;background:#4a4a4a;position:relative}
.toggle .sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#ddd;top:3px;left:3px}
.toggle .sw.on{background:var(--metal)}
.toggle .sw.on::after{left:21px}
.tag{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--metal) 45%,transparent);color:var(--metal-soft)}
.follow{margin-top:16px;border:1px dashed color-mix(in srgb,var(--metal) 50%,transparent);border-radius:var(--radius-sm);padding:12px 13px;color:var(--muted);font-size:13.5px}

/* the one orchestrated moment: chart reveal */
@media (prefers-reduced-motion:no-preference){
  .reveal .cell{animation:rise .5s both}
  .reveal .center{animation:glow 1.1s .2s both}
  .reveal .planet{animation:drop .7s both}
  .reveal .aspect{animation:draw 1.2s 1s both}
}
/* ---------- character + dialogue ---------- */
.char-hero{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.char-hero svg{flex:none;width:112px;height:130px}
.char-hero .who{padding-bottom:10px}
.char-hero .who b{display:block;font-family:var(--display);font-weight:500;font-size:20px;color:var(--paper)}
.char-hero .who span{font-size:12px;color:var(--muted)}
.say{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.say .av{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid var(--metal);background:var(--bg2)}
.say .av svg{width:56px;height:65px;margin:-6px 0 0 -10px}
.bubble{background:var(--paper);color:var(--ink);padding:11px 13px;border-radius:4px 14px 14px 14px;line-height:1.65;font-size:14.5px;max-width:86%}
:root[data-site="tuvi"] .bubble{background:linear-gradient(180deg,#F3E8CF,#EADBB8);border-radius:2px 10px 10px 10px}
/* chiêm tinh: lời nói là tấm kính đêm viền đồng, chữ có chân sáng như ánh sao */
:root[data-site="astro"] .say .bubble{background:linear-gradient(160deg,rgba(43,53,119,.78),rgba(17,23,53,.92));color:#F1EBDD;
  border:1px solid rgba(210,174,99,.55);border-radius:2px 18px 18px 18px;box-shadow:0 0 0 3px rgba(210,174,99,.06),0 8px 24px rgba(5,8,25,.5);
  font-family:"Cormorant Garamond",serif;font-weight:500;font-size:18.5px;line-height:1.5;padding:12px 15px 13px}
:root[data-site="astro"] .say .bubble::before{content:"✦";position:absolute;left:-1px;top:-11px;font-size:11px;color:#D2AE63}
:root[data-site="astro"] .say .bubble.typing{padding:12px 14px}
:root[data-site="astro"] .typing i{background:#D2AE63}
:root[data-site="astro"] .me .bubble{font-family:"Spectral",serif;font-size:15px;background:rgba(210,174,99,.16);border:1px solid rgba(210,174,99,.35)}
:root[data-site="astro"] .field .in{background:transparent;border:0;border-bottom:1px solid rgba(210,174,99,.6);border-radius:0;padding:10px 2px;font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:500}
:root[data-site="astro"] .follow{border-style:solid;border-color:rgba(210,174,99,.3);border-radius:999px;font-style:italic}
:root[data-site="astro"] .lead{font-size:15.5px;font-weight:300;color:#B9BBDD}
.me{display:flex;justify-content:flex-end;margin:4px 0 12px}
.me .bubble, :root[data-site] .me .bubble{background:color-mix(in srgb,var(--metal) 22%,var(--bg2));color:var(--paper);border-radius:14px 4px 14px 14px}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);opacity:.6}
.aspect-row{display:grid;grid-template-columns:78px 52px 1fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--metal) 18%,transparent)}
.aspect-row .an{color:var(--paper);font-size:14px}
.aspect-row .lv{display:flex;gap:3px}
.aspect-row .lv i{width:8px;height:8px;border-radius:50%;border:1px solid var(--metal)}
.aspect-row .lv i.f{background:var(--metal)}
.aspect-row .ad{font-size:12.5px;color:var(--muted);line-height:1.4}
.aspect-row .ad b{display:block;font-weight:500;color:var(--metal-soft);font-size:12px}
.locked{position:relative;margin-top:16px;border:1px solid color-mix(in srgb,var(--metal) 40%,transparent);border-radius:var(--radius-sm);padding:14px;overflow:hidden}
.locked .blur{filter:blur(4px);opacity:.55;pointer-events:none;font-size:13px;line-height:1.7}
.locked .over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;padding:12px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.plan-card{border:1px solid color-mix(in srgb,var(--metal) 40%,transparent);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.plan-card.best{border-color:var(--metal);background:color-mix(in srgb,var(--metal) 10%,transparent)}
.plan-card .ph{display:flex;justify-content:space-between;align-items:baseline}
.plan-card .pn{font-family:var(--display);font-size:21px;color:var(--paper)}
.plan-card .pr{color:var(--metal-soft);font-size:17px}
.plan-card ul{list-style:none;margin-top:8px;font-size:13px;color:var(--muted);line-height:1.7}
.plan-card li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--metal);margin:0 8px 2px 0}
.bubble{position:relative}
.w{display:inline-block}
:root[data-site="tuvi"] .w{animation:ink .8s both}
:root[data-site="astro"] .w{animation:stardust .9s both}
@keyframes ink{0%{opacity:0;filter:blur(3px);color:#A8231B;transform:scale(1.08)}55%{opacity:1;filter:blur(.6px)}100%{opacity:1;filter:none;transform:none}}

const POS = [[1,1],[1,2],[1,3],[1,4],[2,1],[2,4],[3,1],[3,4],[4,1],[4,2],[4,3],[4,4]];
const ORDER = [8,6,4,0,1,2,3,5,7,11,10,9]; // reveal order around the ring, starting at Mệnh

function board(pick){
  let h = `<div class="board reveal" role="img" aria-label="Bàn lá số 12 cung, cung Mệnh ở Dần">`;
  PALACES.forEach((p,i)=>{

    h += `<div class="cell ${p[0]==="Mệnh"?"menh":""} ${pick===p[0]?"pick":""}" style="grid-row:${r};grid-column:${c};animation-delay:${delay}ms">
      <span class="pn">${p[0]}</span>
      <div class="stars">${p[2].map(s=>`<span class="st">${s[0]}<b>${s[1]}</b></span>`).join("")}</div>
      <span class="minor">${p[3]}${p[4]?`<span class="hoa">${p[4]}</span>`:""}</span>
      <span class="chi">${p[1]}</span></div>`;
  });
  h += `<div class="center"><span class="seal" aria-hidden="true">命</span>
    <span class="nm">Nguyễn Minh An</span>
    <span class="meta">Dương nam, tuổi Giáp Tuất<br>Giờ Thìn, ngày 1 tháng 2</span>

/* ---------- chiêm tinh wheel ---------- */
const SIGNS = ["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"];
const PLANETS = [["☉",351],["☽",224],["☿",330],["♀",8],["♂",312],["♃",222],["♄",345],["♅",293],["♆",292],["♇",237]];
const ASPECTS = [[0,1,"tri"],[3,4,"sq"],[1,5,"con"],[0,6,"con"],[2,7,"sx"],[5,9,"con"],[3,1,"sq"]];
function wheel(small){
  const R=170, cx=175, cy=175, asc=130; // asc longitude sets rotation
  const ang = lon => (180 - (lon - asc)) * Math.PI/180;
  const pt = (lon,r)=>[cx + r*Math.cos(ang(lon)), cy - r*Math.sin(ang(lon))];
  let g = `<svg viewBox="0 0 350 350" role="img" aria-label="Bản đồ sao: vòng 12 cung hoàng đạo và vị trí hành tinh" class="${small?"":"reveal"}">
  <defs><radialGradient id="wg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1b2352"/><stop offset="1" stop-color="#0d1230"/></radialGradient></defs>
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#wg)" stroke="#D2AE63" stroke-width="1.2"/>
  <circle cx="${cx}" cy="${cy}" r="${R-30}" fill="none" stroke="#D2AE63" stroke-opacity=".7"/>
  <circle cx="${cx}" cy="${cy}" r="${R-92}" fill="none" stroke="#D2AE63" stroke-opacity=".35"/>`;
  for(let i=0;i<12;i++){
    const a=i*30; const [x1,y1]=pt(a,R); const [x2,y2]=pt(a,R-30);
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#D2AE63" stroke-opacity=".7"/>`;
    const [tx,ty]=pt(a+15,R-15);
    g += `<text x="${tx}" y="${ty}" fill="#EAD7A4" font-size="15" text-anchor="middle" dominant-baseline="central">${SIGNS[i]}︎</text>`;
    for(let d=0; d<30; d+=5){ if(!d) continue; const [a1,b1]=pt(a+d,R-30); const [a2,b2]=pt(a+d,R-35); g+=`<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="#D2AE63" stroke-opacity=".4"/>`;}
  }
  // houses (illustrative equal houses from asc)
  for(let h=0;h<12;h++){ const a=asc+h*30; const [x1,y1]=pt(a,R-30); const [x2,y2]=pt(a,R-92);
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ECE6D6" stroke-opacity="${h%3===0?.55:.18}"/>`;
    const [nx,ny]=pt(a+15,R-84); g+=`<text x="${nx}" y="${ny}" fill="#9A9CC0" font-size="8.5" text-anchor="middle" dominant-baseline="central" font-family="Be Vietnam Pro">${h+1}</text>`;}
  // aspects
  ASPECTS.forEach(([a,b,k],i)=>{ const [x1,y1]=pt(PLANETS[a][1],R-96); const [x2,y2]=pt(PLANETS[b][1],R-96);
    if(k==="con") return;
    const col = k==="sq" ? "#D79AA6" : "#D2AE63";
    g += `<line class="aspect" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-opacity=".75" stroke-width="1" stroke-dasharray="400" style="animation-delay:${1000+i*120}ms"/>`;});
  // planets (nudge overlapping)
  const used=[];
  PLANETS.forEach(([s,lon],i)=>{ let r=R-50; used.forEach(u=>{ if(Math.abs(u-lon)<7) r-=16; }); used.push(lon);
    const [x,y]=pt(lon,r); const [mx,my]=pt(lon,R-30); const [nx,ny]=pt(lon,R-36);
    g += `<g class="planet" style="transform-origin:${x}px ${y}px;animation-delay:${200+i*80}ms"><line x1="${mx}" y1="${my}" x2="${nx}" y2="${ny}" stroke="#ECE6D6"/>
      <text x="${x}" y="${y}" fill="#ECE6D6" font-size="17" text-anchor="middle" dominant-baseline="central">${s}︎</text></g>`;});
  // asc marker
  const [ax,ay]=pt(asc,R+2); g+=`<text x="${ax-14}" y="${ay}" fill="#D79AA6" font-size="9.5" font-family="Be Vietnam Pro" dominant-baseline="central">AC</text>`;
  return g + `</svg>`;
}
function heroArc(){
  let g=`<svg class="arc" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="190" fill="none" stroke="#D2AE63" stroke-opacity=".55"/><circle cx="200" cy="200" r="150" fill="none" stroke="#D2AE63" stroke-opacity=".35"/><circle cx="200" cy="200" r="70" fill="none" stroke="#7B6BC4" stroke-opacity=".5"/>`;
  for(let i=0;i<12;i++){const a=i*30*Math.PI/180; g+=`<line x1="${200+150*Math.cos(a)}" y1="${200+150*Math.sin(a)}" x2="${200+190*Math.cos(a)}" y2="${200+190*Math.sin(a)}" stroke="#D2AE63" stroke-opacity=".5"/>`;

  return g+`<circle cx="268" cy="132" r="5" fill="#EAD7A4"/><circle cx="120" cy="250" r="3" fill="#D79AA6"/></svg>`;
}

/* ---------- lời phán hiện dần: tử vi như mực loang + ấn son, chiêm tinh như bụi sao ---------- */
function animateDialogue(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const STEP = 55; let t = 350; let lastBubble = null;
  document.querySelectorAll("#screen .say .bubble:not(.typing)").forEach(b=>{
    const words = b.textContent.trim().split(/\s+/);
    b.closest(".say").style.animation = `bubbleIn .45s ${t}ms both`;
    b.innerHTML = words.map((w,i)=>`<span class="w" style="animation-delay:${t+250+i*STEP}ms">${w}</span>`).join(" ");
    if(site==="astro"){
      for(let k=0;k<6;k++){ const s=document.createElement("i"); s.className="spark";
        s.style.left=(8+Math.random()*84)+"%"; s.style.top=(5+Math.random()*90)+"%";
        s.style.animationDelay=(t+250+Math.random()*words.length*STEP)+"ms"; b.appendChild(s); }
    }
    lastBubble = b; t += 450 + words.length*STEP;
  });
  const typing = document.querySelector("#screen .bubble.typing");
  if(typing) typing.closest(".say").style.animation = `bubbleIn .3s ${t}ms both`;
  if(site==="tuvi" && lastBubble && current!=="today"){
    const seal=document.createElement("span"); seal.className="seal-stamp"; seal.textContent="印";
    seal.style.animationDelay=t+"ms"; lastBubble.appendChild(seal);
  }
}
