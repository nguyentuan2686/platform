# Self-test fixture: violates only the 'prod-ingress' policy check (an IngressRoute to payment-svc, not web:3000).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: rl, namespace: apps}
spec:
  rateLimit: {average: 20, burst: 40, sourceCriterion: {requestHeaderName: Cf-Connecting-IP}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: fixture, namespace: apps}
spec:
  routes:
    - kind: Rule
      match: Host(`app.example.invalid`) && PathPrefix(`/admin`)
      middlewares: [{name: rl}]
      services: [{name: payment-svc, port: 8085}]
