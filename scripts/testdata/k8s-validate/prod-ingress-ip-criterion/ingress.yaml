# Self-test fixture: violates only the 'prod-ingress' policy check (a rate limit keyed on the source IP, which is cloudflared for every client).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: rl, namespace: apps}
spec:
  rateLimit: {average: 20, burst: 40, sourceCriterion: {ipStrategy: {depth: 0}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fixture
  namespace: apps
  annotations: {traefik.ingress.kubernetes.io/router.middlewares: "apps-rl@kubernetescrd"}
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.invalid
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 3000}}}}
