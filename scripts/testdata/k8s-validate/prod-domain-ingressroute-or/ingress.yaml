# Self-test fixture: violates only the 'prod-domain' policy check (an IngressRoute || alternative matches hosts other than APP_DOMAIN).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: rl, namespace: apps}
spec:
  rateLimit: {average: 20, burst: 40, sourceCriterion: {requestHeaderName: Cf-Connecting-IP}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: fixture, namespace: apps}
spec:
  routes:
    - kind: Rule
      match: Host(`app.example.com`) || Method(`POST`)
      middlewares: [{name: rl}]
      services: [{name: web, port: 3000}]
