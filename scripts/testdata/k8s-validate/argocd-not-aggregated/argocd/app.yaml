# Self-test fixture: violates only the 'argocd' policy check (the path builds but is not a slice of the prod aggregate,
# so the prod checks would not cover it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: fixture, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/nguyentuan2686/platform.git
    targetRevision: main
    path: deploy/k8s/overlays/e2e
  destination: {server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
