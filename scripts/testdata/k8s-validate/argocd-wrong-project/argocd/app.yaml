# Self-test fixture: violates only the 'argocd' policy check (a child Application outside the prod AppProject, so the
# project's plain-Secret blacklist would not apply).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fixture
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-options: "Prune=false,Delete=false"}
spec:
  project: default
  source:
    repoURL: https://github.com/nguyentuan2686/platform.git
    targetRevision: main
    path: deploy/k8s/overlays/prod/apps
  destination: {server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
