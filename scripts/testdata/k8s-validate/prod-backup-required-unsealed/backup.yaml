# Self-test fixture: violates only the 'prod-backup' policy check (BACKUP_REQUIRED=1 without a sealed ops-secrets).
apiVersion: batch/v1
kind: CronJob
metadata: {name: pg-backup, namespace: data}
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump
              image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
              env: [{name: BACKUP_REQUIRED, value: "1"}]
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 32Mi}}
          containers:
            - name: upload
              image: rclone/rclone:1.70.3@sha256:34c729127386abec1c610b2aa024e39b4498dc2b4a72a0798ae21fbdc1b0493b
              env: [{name: BACKUP_REQUIRED, value: "1"}]
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 32Mi}}
