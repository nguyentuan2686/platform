# Self-test fixture: violates only the 'prod-ingress' policy check (payment-svc /admin is not on the public allowlist).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: rl, namespace: apps}
spec:
  rateLimit: {average: 20, burst: 40, sourceCriterion: {requestHeaderName: Cf-Connecting-IP}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: cap, namespace: apps}
spec:
  buffering: {maxRequestBodyBytes: 65536}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fixture
  namespace: apps
  annotations: {traefik.ingress.kubernetes.io/router.middlewares: "apps-rl@kubernetescrd,apps-cap@kubernetescrd"}
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.invalid
      http:
        paths:
          - {path: /admin, pathType: Prefix, backend: {service: {name: payment-svc, port: {number: 8085}}}}
