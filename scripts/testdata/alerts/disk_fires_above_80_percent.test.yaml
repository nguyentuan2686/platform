# Root filesystem above 80 % for 10 minutes fires disk-usage-high; 70 % and other mountpoints do not.
rule_files: [rules.generated.yaml]
evaluation_interval: 1m
tests:
  - name: disk_fires_above_80_percent
    interval: 1m
    input_series:
      - series: 'system_filesystem_utilization_ratio{mountpoint="/", device="/dev/sda1"}'
        values: '0.85+0x30'
      - series: 'system_filesystem_utilization_ratio{mountpoint="/boot", device="/dev/sda15"}'
        values: '0.95+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: disk-usage-high
        exp_alerts:
          - exp_labels: {mountpoint: "/", severity: critical}
  - name: disk_silent_at_70_percent
    interval: 1m
    input_series:
      - series: 'system_filesystem_utilization_ratio{mountpoint="/", device="/dev/sda1"}'
        values: '0.7+0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: disk-usage-high
        exp_alerts: []
