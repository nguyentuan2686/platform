[workspace]
resolver = "2"
members = [
  "libs/rust/platform-core",
  "services/notify-svc",
  "services/chart-svc",
  "services/astro-chart-svc",
  # new-service: cargo-members (scripts/new-service.sh inserts above this line)
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false
rust-version = "1.100"

# Shared dependency versions go here; members use `dep.workspace = true`.
[workspace.dependencies]
vsop87 = "3.0.0"
anyhow = "1.0.105"
time = { version = "0.3.55", features = ["formatting"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["time", "rt-multi-thread", "macros"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "original-uri"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["trace"] }
async-trait = "0.1.89"
thiserror = "2.0.12"
opentelemetry-http = "0.33.0"
http = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_urlencoded = "0.7.1"
form_urlencoded = "1.2.1"
serde_path_to_error = "0.1.17"
http-body-util = "0.1.3"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
rdkafka = { version = "0.40.0", features = ["cmake-build", "tokio"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "time", "uuid", "migrate", "macros"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }
tokio-util = "0.7.20"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
jsonschema = { version = "0.63.1", default-features = false }
yaml_serde = "0.10.7"
# Embeds the tz database: the distroless runtime image has no /usr/share/zoneinfo.
jiff = { version = "1.0", default-features = false, features = ["std", "tzdb-bundle-always"] }
x-iztro = { version = "0.9.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for service code:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true
