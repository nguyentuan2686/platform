[workspace]
resolver = "2"
members = ["libs/rust/platform-core", "services/notify-svc"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false
rust-version = "1.100"

# Shared dependency versions go here; members use `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.105"
time = { version = "0.3.55", features = ["formatting"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for service code:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true
