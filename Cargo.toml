[workspace]
resolver = "2"
members = ["libs/rust/platform-core", "services/notify-svc"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false
rust-version = "1.100"

# Shared dependency versions go here; members use `dep.workspace = true`.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for service code:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true
