apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE__
  labels:
    app.kubernetes.io/name: __SERVICE__
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __SERVICE__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __SERVICE__
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: __SERVICE__
          image: ghcr.io/nguyentuan2686/__SERVICE__
          ports:
            - {name: http, containerPort: __PORT__}
          env:
            - {name: PORT, value: "__PORT__"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_SERVICE_NAME, value: __SERVICE__}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "60000"}
            - {name: OTEL_LOGS_EXPORTER, value: none} # logs reach Loki via the collector's filelog, not OTLP
            - {name: JAVA_TOOL_OPTIONS, value: "-javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=60"}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 512Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 36 # 180 s
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
