apiVersion: apps/v1
kind: Deployment
metadata:
  name: reading-tuvi
  labels:
    app.kubernetes.io/name: reading-tuvi
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reading-tuvi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reading-tuvi
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reading-tuvi
          image: ghcr.io/nguyentuan2686/reading-tuvi
          ports:
            - {name: http, containerPort: 8083}
          env:
            - {name: PORT, value: "8083"}
            - {name: DB_URL, value: "jdbc:postgresql://postgres.data.svc.cluster.local:5432/reading_tuvi"}
            - {name: CHART_SVC_URL, value: "http://chart-svc.apps.svc.cluster.local:8082"}
            - {name: KNOWLEDGE_DIR, value: /app/knowledge/tuvi}
            - {name: IDENTITY_SVC_URL, value: "http://identity-svc.apps.svc.cluster.local:8084"}
            - {name: QA_JOBS_ENABLED, value: "true"}
            - {name: QA_JOB_INTERVAL, value: PT1M}
            # LLM_PROVIDERS (and LLM_FAKE_MODE) are set per overlay.
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_SERVICE_NAME, value: reading-tuvi}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "60000"}
            - {name: OTEL_LOGS_EXPORTER, value: none} # logs reach Loki via the collector's filelog, not OTLP
            - {name: JAVA_TOOL_OPTIONS, value: "-javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=50"}
          envFrom:
            - secretRef: {name: reading-tuvi-secrets}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 384Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 36 # 180 s
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
