apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-svc
  labels:
    app.kubernetes.io/name: chart-svc
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chart-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chart-svc
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chart-svc
          image: ghcr.io/nguyentuan2686/chart-svc
          ports:
            - {name: http, containerPort: 8082}
          env:
            - {name: PORT, value: "8082"}
            - {name: RUST_LOG, value: info}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_SERVICE_NAME, value: chart-svc}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "60000"}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 64Mi}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
