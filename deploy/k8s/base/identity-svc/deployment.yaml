apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-svc
  labels:
    app.kubernetes.io/name: identity-svc
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-svc
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: identity-svc
          image: ghcr.io/nguyentuan2686/identity-svc
          ports:
            - {name: http, containerPort: 8084}
          env:
            - {name: PORT, value: "8084"}
            - {name: DB_URL, value: "jdbc:postgresql://postgres.data.svc.cluster.local:5432/identity"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "redpanda.data.svc.cluster.local:9092"}
            # WEB_BASE_URL, MAIL_HOST, MAIL_PORT and MAIL_FROM are set per overlay.
            # Google login stays off until a client id is configured.
            - {name: OIDC_GOOGLE_CLIENT_ID, value: ""}
            - {name: OIDC_REDIRECT_URIS, value: ""}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_SERVICE_NAME, value: identity-svc}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "60000"}
            - {name: OTEL_LOGS_EXPORTER, value: none} # logs reach Loki via the collector's filelog, not OTLP
          envFrom:
            - secretRef: {name: identity-svc-secrets}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 512Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 36 # 180 s
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
