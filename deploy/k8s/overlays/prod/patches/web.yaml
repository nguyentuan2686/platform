apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            # The web image bakes WEB_ORIGIN at build time too (Docker build arg); CD must pass the same origin.
            - {name: WEB_ORIGIN, value: "https://app.example.invalid"}
            - {name: DEPLOY_ENV, value: prod}
