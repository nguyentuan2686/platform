# Prod platform slice (Argo CD app `prod-platform`, wave 0): Postgres, Redpanda, observability. The namespaces belong
# to ../sealed (wave -1), so they are deleted here: two Argo apps must not own the same object.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata: {name: apps}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata: {name: data}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata: {name: observability}
