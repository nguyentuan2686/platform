# Prod platform slice (Argo CD app `prod-platform`, wave 0): Postgres, Redpanda, observability. The namespaces belong
# to ../sealed (wave -1), so they are deleted here: two Argo apps must not own the same object.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform
  - ops-reader.yaml # read-only operator access over the tailnet (go-live.md §6a)
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata: {name: apps}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata: {name: data}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata: {name: observability}
  # pg-backup: BACKUP_REQUIRED=0 until ops-secrets (S3_*) is sealed, so the job skips instead of failing.
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: pg-backup, namespace: data}
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                initContainers:
                  - name: dump
                    env:
                      - {name: BACKUP_REQUIRED, value: "0"} # go-live: set 1
                containers:
                  - name: upload
                    env:
                      - {name: BACKUP_REQUIRED, value: "0"} # go-live: set 1
  # Telegram alerts (alerting-secrets is sealed in prod): the init container renders the contact point only at pod
  # start, so (a) it must wait for the Secret instead of starting without it (non-optional ref: the kubelet retries
  # until prod-sealed has unsealed it), and (b) the pod restarts when this revision changes. Bump it in the PR that
  # re-seals alerting-secrets (token or chat rotation); Argo then rolls lgtm with the new values, no manual restart.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: lgtm, namespace: observability}
      spec:
        template:
          metadata:
            annotations:
              platform.dev/alerting-secrets-rev: "1"
          spec:
            initContainers:
              - name: alerting-render
                envFrom:
                  - secretRef: {name: alerting-secrets}
