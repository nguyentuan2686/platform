apiVersion: apps/v1
kind: Deployment
metadata:
  name: reading-tuvi
spec:
  template:
    spec:
      containers:
        - name: reading-tuvi
          env:
            # ADR 0003: ordered failover list; each provider is enabled only when its API key is in reading-tuvi-secrets (a keyless one is skipped with a WARN; cerebras has no key yet).
            - {name: LLM_PROVIDERS, value: "claude,gemini,groq,openrouter,cerebras"}
