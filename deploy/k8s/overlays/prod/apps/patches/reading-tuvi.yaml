apiVersion: apps/v1
kind: Deployment
metadata:
  name: reading-tuvi
spec:
  template:
    spec:
      containers:
        - name: reading-tuvi
          env:
            # ADR 0003: ordered failover list; claude/gemini/groq are enabled only when their API key is set (claude has none yet, so it is skipped).
            - {name: LLM_PROVIDERS, value: "claude,gemini,groq"}
            - {name: LLM_PROVIDERS, value: "claude,gemini,groq"}
