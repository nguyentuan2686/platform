# Prod overlay aggregate of the four slices that Argo CD deploys as separate apps (deploy/argocd/apps). Built as a
# whole by scripts/k8s-validate.sh; Argo never builds this file (two apps must not own the same objects).
#   sealed/    namespaces + SealedSecrets from scripts/seal-secrets.sh (prod-sealed,   wave -1)
#   platform/  Postgres, Redpanda, observability                       (prod-platform, wave 0)
#   tunnel/    cloudflared (ns edge)                                   (prod-tunnel,   wave 1)
#   apps/      the 7 services, Ingress, image tags bumped by CD        (prod-apps,     wave 1)
# APP_DOMAIN: domain/domain.yaml (the only place). Secret inventory: secrets.tsv.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform
  - tunnel
  - apps
  - sealed
