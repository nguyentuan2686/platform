apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-svc
spec:
  template:
    spec:
      containers:
        - name: identity-svc
          env:
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000"}
            - {name: WEB_BASE_URL, value: "http://localhost:3001"}
            - {name: MAIL_HOST, value: mailpit.data.svc.cluster.local}
            - {name: MAIL_PORT, value: "1025"}
            - {name: MAIL_FROM, value: "no-reply@localhost"}
