# kind cluster for the CI job k8s-e2e (.github/workflows/_k8s-e2e.yml). Not a kustomize resource.
# One control-plane node; node image pinned by digest (kind v0.32.0 release notes), Kubernetes 1.33 to match the
# kubeconform version in scripts/k8s-validate.sh.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
