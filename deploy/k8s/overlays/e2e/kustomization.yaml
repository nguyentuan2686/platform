# E2E overlay: test values only (same as deploy/local/docker-compose.yml). Used by the CI kind job; images are
# loaded into kind as <svc>:e2e. Nothing here is for production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform
  - ../../base/order-svc
  - ../../base/notify-svc
  - ../../base/chart-svc
  - ../../base/reading-tuvi
  - ../../base/identity-svc
  - ../../base/payment-svc
  - ../../base/web
  - mailpit.yaml
patches:
  - path: patches/order-svc.yaml
  - path: patches/notify-svc.yaml
  - path: patches/chart-svc.yaml
  - path: patches/reading-tuvi.yaml
  - path: patches/identity-svc.yaml
  - path: patches/payment-svc.yaml
  - path: patches/web.yaml
  - path: patches/otel-collector.yaml
  - target: {kind: Deployment, namespace: apps}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: IfNotPresent}
images:
  - {name: ghcr.io/nguyentuan2686/order-svc, newName: order-svc, newTag: e2e}
  - {name: ghcr.io/nguyentuan2686/notify-svc, newName: notify-svc, newTag: e2e}
  - {name: ghcr.io/nguyentuan2686/chart-svc, newName: chart-svc, newTag: e2e}
  - {name: ghcr.io/nguyentuan2686/reading-tuvi, newName: reading-tuvi, newTag: e2e}
  - {name: ghcr.io/nguyentuan2686/identity-svc, newName: identity-svc, newTag: e2e}
  - {name: ghcr.io/nguyentuan2686/payment-svc, newName: payment-svc, newTag: e2e}
  - {name: ghcr.io/nguyentuan2686/web, newName: web, newTag: e2e}
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - {name: order-svc-secrets, namespace: apps, envs: [secrets/order-svc-secrets.env]}
  - {name: notify-svc-secrets, namespace: apps, envs: [secrets/notify-svc-secrets.env]}
  - {name: reading-tuvi-secrets, namespace: apps, envs: [secrets/reading-tuvi-secrets.env]}
  - {name: identity-svc-secrets, namespace: apps, envs: [secrets/identity-svc-secrets.env]}
  - {name: payment-svc-secrets, namespace: apps, envs: [secrets/payment-svc-secrets.env]}
  - {name: web-secrets, namespace: apps, envs: [secrets/web-secrets.env]}
  - {name: postgres-secrets, namespace: data, envs: [secrets/postgres-secrets.env]}
