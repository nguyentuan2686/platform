# Platform alert rules as code (Grafana alerting provisioning). Each rule's query A holds the full PromQL including
# its comparison, so it returns a series only while the condition holds; threshold B (A > 0) then fires.
# scripts/alerts-promtool.sh turns these same expressions into Prometheus rules for the promtool unit tests
# (scripts/testdata/alerts), so edit the expr here and the tests there together.
apiVersion: 1
groups:
  - orgId: 1
    name: platform
    folder: Platform
    interval: 1m
    rules:
      - uid: error-rate-high
        title: Error rate high
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "5xx ratio above 5% on {{ $$labels.job }}"
          runbook_url: https://github.com/nguyentuan2686/platform/blob/main/docs/runbooks/alerts.md#error-rate-high
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: '(sum by (job) (rate(http_server_request_duration_seconds_count{http_route!~"/health/.*|/tuvi/qa/readings.*", http_response_status_code=~"5.."}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count{http_route!~"/health/.*|/tuvi/qa/readings.*"}[5m])) > 0.05) and sum by (job) (rate(http_server_request_duration_seconds_count{http_route!~"/health/.*|/tuvi/qa/readings.*"}[5m])) > 0.01'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: latency-p95-high
        title: Latency p95 high
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s on {{ $$labels.job }}"
          runbook_url: https://github.com/nguyentuan2686/platform/blob/main/docs/runbooks/alerts.md#latency-p95-high
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'histogram_quantile(0.95, sum by (job, le) (rate(http_server_request_duration_seconds_bucket{http_route!~"/health/.*|/tuvi/qa/readings.*"}[5m]))) > 1'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: pod-restart-loop
        title: Pod restart loop
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $$labels.k8s_pod_name }} restarted 3+ times in 15m"
          runbook_url: https://github.com/nguyentuan2686/platform/blob/main/docs/runbooks/alerts.md#pod-restart-loop
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'max by (k8s_namespace_name, k8s_pod_name) (delta(k8s_container_restarts[15m])) >= 3'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: consumer-lag-rising
        title: Consumer lag rising
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "consumer group {{ $$labels.redpanda_group }} lag above 100 and growing"
          runbook_url: https://github.com/nguyentuan2686/platform/blob/main/docs/runbooks/alerts.md#consumer-lag-rising
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'max by (redpanda_group) (redpanda_kafka_consumer_group_lag_max) > 100 and max by (redpanda_group) (deriv(redpanda_kafka_consumer_group_lag_max[10m])) > 0'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: disk-usage-high
        title: Disk usage high
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "node disk {{ $$labels.mountpoint }} above 80%"
          runbook_url: https://github.com/nguyentuan2686/platform/blob/main/docs/runbooks/alerts.md#disk-usage-high
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'max by (mountpoint) (system_filesystem_utilization_ratio{mountpoint="/"}) > 0.8'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: deploy-failed
        title: Deploy failed
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Argo CD app {{ $$labels.name }} is Degraded or Missing"
          runbook_url: https://github.com/nguyentuan2686/platform/blob/main/docs/runbooks/alerts.md#deploy-failed
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'max by (name) (argocd_app_info{health_status=~"Degraded|Missing"}) > 0'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
