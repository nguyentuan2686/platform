# Rendered by render.sh only when TELEGRAM_BOT_TOKEN is set (@NAME@ = env NAME). Never committed with a real value.
# The message is the short Vietnamese template below (telegram.vi), not Grafana's default label/annotation/URL dump:
# per notification a header "🔴 Lỗi" (firing) or "✅ Đã ổn" (resolved), then per alert its `summary` annotation,
# `Dịch vụ: <service annotation>` and the start (firing) or end (resolved) time in Asia/Ho_Chi_Minh. Every rule in
# rules.yaml sets both annotations in plain Vietnamese.
apiVersion: 1
templates:
  - orgId: 1
    name: telegram-vi
    template: |
      {{ define "telegram.vi.time" }}{{ . | tz "Asia/Ho_Chi_Minh" | date "15:04 02/01/2006" }}{{ end }}
      {{ define "telegram.vi.alert" -}}
      {{ or .Annotations.summary .Labels.alertname }}
      Dịch vụ: {{ or .Annotations.service "-" }}
      {{- end }}
      {{ define "telegram.vi" -}}
      {{ if .Alerts.Firing -}}
      🔴 <b>Lỗi</b>
      {{ range .Alerts.Firing }}
      {{ template "telegram.vi.alert" . }}
      Lúc: {{ template "telegram.vi.time" .StartsAt }}
      {{ end }}{{ end -}}
      {{ if and .Alerts.Firing .Alerts.Resolved }}
      {{ end -}}
      {{ if .Alerts.Resolved -}}
      ✅ <b>Đã ổn</b>
      {{ range .Alerts.Resolved }}
      {{ template "telegram.vi.alert" . }}
      Hết lúc: {{ template "telegram.vi.time" .EndsAt }}
      {{ end }}{{ end -}}
      {{- end }}
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: "@TELEGRAM_BOT_TOKEN@"
          chatid: "@TELEGRAM_CHAT_ID@"
          message: '{{ template "telegram.vi" . }}'
          parse_mode: HTML
          disable_web_page_preview: true
