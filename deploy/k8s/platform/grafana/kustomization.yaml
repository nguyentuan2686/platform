apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # Dashboards: fixed names, Grafana's file provider picks up a changed ConfigMap without a restart.
  - name: grafana-dashboards
    options: {disableNameSuffixHash: true}
    files:
      - dashboards/platform-red.json
      - dashboards/platform-messaging.json
  - name: grafana-dashboard-provider
    options: {disableNameSuffixHash: true}
    files:
      - provisioning/platform-dashboards.yaml
  # Alerting: content-hash name suffix. The lgtm init container renders these files only at pod start, so a changed
  # rule or Telegram template must restart lgtm; the new name in the pod template makes Argo CD roll it by itself.
  - name: grafana-alerting
    files:
      - alerting/rules.yaml
      - alerting/contact-point.tmpl.yaml
      - alerting/policy.tmpl.yaml
      - alerting/render.sh
