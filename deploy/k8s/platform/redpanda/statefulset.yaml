apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels: {app: redpanda}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.1.1
          # Same flags as deploy/local/docker-compose.yml, minus the external listener.
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda.data.svc.cluster.local:9092
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: admin, containerPort: 9644}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 768Mi}
          readinessProbe:
            exec:
              command: [sh, -c, "rpk cluster health | grep -q 'Healthy:.*true'"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
            - {name: bootstrap, mountPath: /etc/redpanda/.bootstrap.yaml, subPath: bootstrap.yaml, readOnly: true}
      volumes:
        - name: bootstrap
          configMap:
            name: redpanda-bootstrap
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
