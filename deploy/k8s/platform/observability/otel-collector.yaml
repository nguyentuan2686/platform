apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels: {app: otel-collector}
spec:
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.141.0
          args: [--config=/etc/otelcol/config.yaml]
          env:
            - {name: DEPLOY_ENV, value: prod}
            - name: K8S_NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          # Root on purpose: pod log files under /var/log/pods are root-owned (the only root app-facing pod; see ADR 0004).
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 320Mi}
            limits: {memory: 320Mi}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            # file_storage (checkpoints + export queue): survives a collector restart or rollout. Writable host path, the
            # one exception to the hostpath-root policy (scripts/k8s-validate.sh).
            - {name: state, mountPath: /var/lib/otelcol}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/otelcol
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: {app: otel-collector}
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
