extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

  # Redpanda measures consumer-group lag itself (see redpanda/bootstrap.yaml).
  prometheus:
    config:
      scrape_configs:
        - job_name: redpanda
          scrape_interval: 15s
          metrics_path: /public_metrics
          static_configs:
            - targets: ['redpanda.data.svc.cluster.local:9644']

  # Service logs are JSON lines on stdout (CLAUDE.md logging contract).
  filelog:
    include: [/var/log/pods/apps_*/*/*.log]
    start_at: end
    include_file_path: true
    operators:
      - type: container
      - type: json_parser
        if: 'body matches "^\\{"'
        parse_from: body
        parse_to: attributes
        on_error: send
      - type: severity_parser
        if: 'attributes.level != nil'
        parse_from: attributes.level
      - type: trace_parser
        if: 'attributes.trace_id != nil and attributes.span_id != nil'
        trace_id: {parse_from: attributes.trace_id}
        span_id: {parse_from: attributes.span_id}
      - type: move
        if: 'attributes.message != nil'
        from: attributes.message
        to: body
      - type: move
        if: 'attributes.service != nil'
        from: attributes.service
        to: resource["service.name"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  resource:
    attributes:
      - {key: deployment.environment.name, value: '${env:DEPLOY_ENV}', action: upsert}
  batch: {}

exporters:
  otlphttp:
    endpoint: http://lgtm.observability.svc.cluster.local:4318

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
