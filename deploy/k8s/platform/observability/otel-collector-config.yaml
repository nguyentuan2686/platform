extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

  # Redpanda measures consumer-group lag itself (see redpanda/bootstrap.yaml).
  prometheus:
    config:
      scrape_configs:
        - job_name: redpanda
          scrape_interval: 15s
          metrics_path: /public_metrics
          static_configs:
            - targets: ['redpanda.data.svc.cluster.local:9644']
        # Argo CD application controller metrics (deploy-failed alert). No target in the kind e2e cluster: the alert stays NoData -> OK.
        - job_name: argocd
          scrape_interval: 30s
          static_configs:
            - targets: ['argocd-metrics.argocd.svc.cluster.local:8082']

  # Cluster state for alerts (container restarts, node conditions). Single node: one DaemonSet pod. See rbac.yaml.
  k8s_cluster:
    collection_interval: 30s
    node_conditions_to_report: [Ready, DiskPressure]

  # Node filesystem usage/capacity for the disk-usage-high alert, read from the node's kubelet (nodes/stats RBAC), so no
  # pod needs the host filesystem. See rbac.yaml and docs/runbooks/alerts.md (collector privileges).
  kubeletstats:
    collection_interval: 30s
    auth_type: serviceAccount
    endpoint: ${env:K8S_NODE_IP}:10250
    insecure_skip_verify: true # kubelet serving cert is self-signed (k3s, kind); the token still authenticates us to it
    metric_groups: [node]
    metrics:
      k8s.node.filesystem.usage: {enabled: true}
      k8s.node.filesystem.capacity: {enabled: true}

  # Service logs are JSON lines on stdout (CLAUDE.md logging contract).
  filelog:
    include: [/var/log/pods/apps_*/*/*.log]
    start_at: end
    include_file_path: true
    operators:
      - type: container
      - type: json_parser
        if: 'body matches "^\\{"'
        parse_from: body
        parse_to: attributes
        on_error: send
      - type: severity_parser
        if: 'attributes.level != nil'
        parse_from: attributes.level
      - type: trace_parser
        if: 'attributes.trace_id != nil and attributes.span_id != nil'
        trace_id: {parse_from: attributes.trace_id}
        span_id: {parse_from: attributes.span_id}
      - type: move
        if: 'attributes.message != nil'
        from: attributes.message
        to: body
      - type: move
        if: 'attributes.service != nil'
        from: attributes.service
        to: resource["service.name"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - {key: deployment.environment.name, value: '${env:DEPLOY_ENV}', action: upsert}
  batch: {}

exporters:
  otlphttp:
    endpoint: http://lgtm.observability.svc.cluster.local:4318

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp, prometheus, k8s_cluster, kubeletstats]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
