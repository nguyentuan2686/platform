# Local dev stack. Infra only by default; add `--profile app` to also run the services (order-svc, notify-svc, chart-svc, reading-tuvi, identity-svc, payment-svc, mailpit, web).
name: platform-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=orders psql -h 127.0.0.1 -U orders -d orders -c 'select 1'"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    mem_limit: 1024m

  order-svc:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/order-svc/Dockerfile
    image: order-svc:local
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      lgtm:
        condition: service_started
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: ${DB_USER:-orders}
      DB_PASSWORD: ${DB_PASSWORD:-orders}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=60"
    ports:
      - "127.0.0.1:${ORDER_SVC_PORT:-8080}:8080"
    mem_limit: 768m

  notify-svc:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/notify-svc/Dockerfile
    image: notify-svc:local
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      lgtm:
        condition: service_started
    environment:
      PORT: "8081"
      DB_URL: postgres://${NOTIFY_DB_USER:-notify}:${NOTIFY_DB_PASSWORD:-notify}@postgres:5432/notify
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_GROUP_ID: notify-svc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_SERVICE_NAME: notify-svc
      RUST_LOG: ${NOTIFY_RUST_LOG:-info}
    ports:
      - "127.0.0.1:${NOTIFY_SVC_PORT:-8081}:8081"
    mem_limit: 128m

  chart-svc:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/chart-svc/Dockerfile
    image: chart-svc:local
    depends_on:
      lgtm:
        condition: service_started
    environment:
      PORT: "8082"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_SERVICE_NAME: chart-svc
      RUST_LOG: ${CHART_RUST_LOG:-info}
    ports:
      - "127.0.0.1:${CHART_SVC_PORT:-8082}:8082"
    mem_limit: 64m

  reading-tuvi:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/reading-tuvi/Dockerfile
    image: reading-tuvi:local
    depends_on:
      postgres:
        condition: service_healthy
      chart-svc:
        condition: service_started
      lgtm:
        condition: service_started
      identity-svc:
        condition: service_started
    environment:
      PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/reading_tuvi
      DB_USER: ${READING_DB_USER:-reading}
      DB_PASSWORD: ${READING_DB_PASSWORD:-reading}
      CHART_SVC_URL: http://chart-svc:8082
      KNOWLEDGE_DIR: /app/knowledge/tuvi
      # Same token identity-svc expects; /tuvi/qa/** requires it.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-test-internal-token}
      IDENTITY_SVC_URL: http://identity-svc:8084
      # base64 of the 32-byte test phrase "local-test-qa-answer-key-0123456" (AES-256 key)
      QA_ENC_KEY: ${QA_ENC_KEY:-bG9jYWwtdGVzdC1xYS1hbnN3ZXIta2V5LTAxMjM0NTY=}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-fake}
      LLM_FAKE_MODE: ${LLM_FAKE_MODE:-ok}
      # Real keys: set only via Sealed Secrets / your shell, never commit.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QA_JOBS_ENABLED: ${QA_JOBS_ENABLED:-true}
      QA_JOB_INTERVAL: ${QA_JOB_INTERVAL:-PT1M}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=50"
    ports:
      - "127.0.0.1:${READING_TUVI_PORT:-8083}:8083"
    mem_limit: 384m

  mailpit:
    profiles: ["app"]
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    mem_limit: 64m

  # Test values only (see .env.example); real ones come from Sealed Secrets.
  identity-svc:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/identity-svc/Dockerfile
    image: identity-svc:local
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/identity
      DB_USER: ${IDENTITY_DB_USER:-identity}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-test-internal-token}
      # base64 of the 32-byte test phrase "local-test-profile-key-012345678"
      PROFILE_ENC_KEY: ${PROFILE_ENC_KEY:-bG9jYWwtdGVzdC1wcm9maWxlLWtleS0wMTIzNDU2Nzg=}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3001}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      # Google login stays off locally (empty client id).
      OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      OIDC_REDIRECT_URIS: ${OIDC_REDIRECT_URIS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "127.0.0.1:${IDENTITY_SVC_PORT:-8084}:8084"
    mem_limit: 384m

  payment-svc:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/payment-svc/Dockerfile
    image: payment-svc:local
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      PORT: "8085"
      DB_URL: jdbc:postgresql://postgres:5432/payment
      DB_USER: ${PAYMENT_DB_USER:-payment}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-test-internal-token}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-test-admin-token}
      IDENTITY_SVC_URL: http://identity-svc:8084
      SEPAY_WEBHOOK_AUTH: ${SEPAY_WEBHOOK_AUTH:-apikey}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-local-test-sepay-secret}
      # Fake receiving account: never a real one.
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-TEST BANK}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-0000000000}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-TEST BANK}
      SEPAY_RECONCILE_ENABLED: "false"
      PAYPAL_MODE: fake
      PAYPAL_FAKE_WEBHOOK_SECRET: ${PAYPAL_FAKE_WEBHOOK_SECRET:-local-test-paypal-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "127.0.0.1:${PAYMENT_SVC_PORT:-8085}:8085"
    mem_limit: 384m

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
    image: web:local
    depends_on:
      chart-svc:
        condition: service_started
      reading-tuvi:
        condition: service_started
      identity-svc:
        condition: service_started
    environment:
      PORT: "3000"
      CHART_SVC_URL: http://chart-svc:8082
      READING_URL: http://reading-tuvi:8083
      IDENTITY_SVC_URL: http://identity-svc:8084
      PAYMENT_SVC_URL: http://payment-svc:8085
      # Test value only; server-side, never sent to the browser.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-test-internal-token}
      WEB_ORIGIN: http://localhost:3001
      COOKIE_SECURE: "0"
    ports:
      # Host 3000 is taken by Grafana (lgtm), so web defaults to 3001.
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    mem_limit: 256m

volumes:
  pgdata:
