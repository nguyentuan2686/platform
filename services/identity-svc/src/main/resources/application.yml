server:
  port: ${PORT:8084}

spring:
  application:
    name: identity-svc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: identity-svc
      auto-offset-reset: earliest
      enable-auto-commit: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # A real relay (prod): MAIL_SMTP_AUTH=true + MAIL_STARTTLS=true, MAIL_USERNAME/MAIL_PASSWORD from identity-svc-secrets.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      # required = refuse to send (and so to send credentials) when the server offers no STARTTLS
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      # JavaMail waits forever by default; the mail is sent inside the request, so a stalled relay must not pin threads.
      mail.smtp.connectiontimeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_TIMEOUT_MS:5000}

platform:
  # identity-svc publishes no events (it only consumes PaymentSucceeded).
  outbox:
    enabled: false
  # Empty = internal-token filter off (local use only); set INTERNAL_API_TOKEN everywhere else.
  internal-token: ${INTERNAL_API_TOKEN:}

# OTLP export is configured by the OpenTelemetry agent from OTEL_EXPORTER_OTLP_ENDPOINT.

identity:
  web-base-url: ${WEB_BASE_URL:http://localhost:3001}
  profile:
    # base64 of 32 bytes (AES-256); startup fails when missing or the wrong length.
    enc-key: ${PROFILE_ENC_KEY:}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
    # Global cap on magic-link mails over all addresses per rolling 24 h (spam-relay guard); reached = 429.
    daily-cap: ${MAIL_DAILY_CAP:200}
  oidc:
    google:
      issuer: ${OIDC_GOOGLE_ISSUER:https://accounts.google.com}
      # Empty client id = Google login disabled (503).
      client-id: ${OIDC_GOOGLE_CLIENT_ID:}
      client-secret: ${OIDC_GOOGLE_CLIENT_SECRET:}
      # Comma-separated exact redirect URIs the web app may use.
      redirect-uris: ${OIDC_REDIRECT_URIS:}
