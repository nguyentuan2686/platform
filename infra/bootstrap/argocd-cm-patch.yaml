# Applied by infra/bootstrap (lib/argocd.sh render_argocd_cm) server-side with its own field manager on top of Argo
# CD's install.yaml. Application health: Argo CD >= 1.8 no longer assesses the health of an Application resource, so
# without this the root app's sync waves (prod-sealed -1, prod-platform 0, prod-tunnel/prod-apps 1) would not wait for
# a child app to be Healthy before syncing the next wave.
# The lines between `-- ci-mode-begin` and `-- ci-mode-end` are rendered only with GITOPS_CI_MODE=1: there, a child
# carrying platform.dev/ci-manual-sync: "true" (set by bootstrap on the apps it leaves unsynced) counts as Healthy, so
# the root app can still become Healthy. In prod the branch does not exist, so no annotation can mask a child's health.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    -- ci-mode-begin
    if obj.metadata.annotations ~= nil and obj.metadata.annotations["platform.dev/ci-manual-sync"] == "true" then
      hs.status = "Healthy"
      hs.message = "CI mode: left unsynced by infra/bootstrap"
      return hs
    end
    -- ci-mode-end
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
  # Ingress: Argo CD's built-in check stays Progressing until status.loadBalancer.ingress is set. k3s's Traefik is a
  # ClusterIP Service behind cloudflared (traefik-config.yaml), so no Ingress ever gets that status and prod-apps would
  # never turn Healthy (issue #53). An Ingress with at least one rule counts as Healthy; one without rules is Degraded.
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    if obj.spec ~= nil and obj.spec.rules ~= nil and #obj.spec.rules > 0 then
      hs.status = "Healthy"
      hs.message = "routed by Traefik (ClusterIP behind cloudflared, no load balancer status by design)"
    else
      hs.status = "Degraded"
      hs.message = "Ingress has no rules"
    end
    return hs
