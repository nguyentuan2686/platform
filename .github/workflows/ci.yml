name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Manual run on main: publish_all builds and pushes every service image as sha-<commit> (go-live pins all 7 once;
  # also the fix when an image is missing). cd.yml then bumps the prod tags for that commit.
  workflow_dispatch:
    inputs:
      publish_all:
        description: Build and publish every service image (only on main)
        type: boolean
        default: false

# PRs: one group per branch, a new push cancels the old run. main (push/dispatch): one group per commit, so a burst
# of merges never cancels a pending run (GitHub drops all but one pending run per group), and every merge publishes
# its images for CD.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      order: ${{ steps.filter.outputs.order }}
      root: ${{ steps.filter.outputs.root }}
      starter: ${{ steps.filter.outputs.starter }}
      notify: ${{ steps.filter.outputs.notify }}
      chart: ${{ steps.filter.outputs.chart }}
      reading: ${{ steps.filter.outputs.reading }}
      identity: ${{ steps.filter.outputs.identity }}
      payment: ${{ steps.filter.outputs.payment }}
      web: ${{ steps.filter.outputs.web }}
      k8s: ${{ steps.filter.outputs.k8s }}
      ops: ${{ steps.filter.outputs.ops }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            starter:
              - 'libs/java/**'
            order:
              - 'services/order-svc/**'
              - 'contracts/**'
              - 'libs/java/**'
            notify:
              - 'services/notify-svc/**'
              - 'libs/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'deny.toml'
              - 'contracts/**'
            chart:
              - 'services/chart-svc/**'
              - 'libs/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.cargo/**'
              - 'contracts/openapi/chart-svc.yaml'
            reading:
              - 'services/reading-tuvi/**'
              - 'knowledge/**'
              - 'contracts/openapi/reading-tuvi.yaml'
              - 'contracts/openapi/identity-svc.yaml'
              - 'contracts/knowledge/**'
              - 'libs/java/**'
            identity:
              - 'services/identity-svc/**'
              - 'contracts/openapi/identity-svc.yaml'
              - 'contracts/events/payment-succeeded.v1.schema.json'
              - 'libs/java/**'
            payment:
              - 'services/payment-svc/**'
              - 'contracts/openapi/payment-svc.yaml'
              - 'contracts/events/payment-succeeded.v1.schema.json'
              - 'libs/java/**'
            web:
              - 'services/web/**'
              - 'knowledge/tuvi/**'
            k8s:
              - 'deploy/k8s/**'
              - 'deploy/argocd/**'
              - 'deploy/local/**'
              - 'scripts/**'
              - '.github/workflows/_k8s-e2e.yml'
            ops:
              - 'scripts/**'
              - 'infra/**'
              - 'deploy/argocd/**'
              - 'deploy/k8s/overlays/prod/**' # secrets.tsv and domain.yaml feed the script tests
              - 'deploy/k8s/platform/grafana/alerting/**' # rules.yaml feeds the promtool alert tests
              - 'deploy/k8s/platform/ops/**' # the backup/heartbeat scripts are under test
              - '.github/**'
            infra:
              - 'infra/**'
              - 'deploy/argocd/**'
              - 'deploy/k8s/overlays/prod/**'
              - '.github/workflows/_bootstrap.yml'
            root:
              - '.mvn/**'
              - 'pom.xml'
              - '.github/**'

  order-svc:
    needs: changes
    if: needs.changes.outputs.order == 'true' || needs.changes.outputs.root == 'true' || inputs.publish_all
    # packages: write is only exercised when publish is true (push or manual dispatch on main)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/order-svc
      image: order-svc
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  notify-svc:
    needs: changes
    if: needs.changes.outputs.notify == 'true' || needs.changes.outputs.root == 'true' || inputs.publish_all
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_rust-service.yml
    with:
      package: notify-svc
      image: notify-svc
      dockerfile: services/notify-svc/Dockerfile
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  chart-svc:
    needs: changes
    if: needs.changes.outputs.chart == 'true' || needs.changes.outputs.root == 'true' || inputs.publish_all
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_rust-service.yml
    with:
      package: chart-svc
      image: chart-svc
      dockerfile: services/chart-svc/Dockerfile
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  reading-tuvi:
    needs: changes
    if: needs.changes.outputs.reading == 'true' || needs.changes.outputs.root == 'true' || inputs.publish_all
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/reading-tuvi
      image: reading-tuvi
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  identity-svc:
    needs: changes
    if: needs.changes.outputs.identity == 'true' || needs.changes.outputs.root == 'true' || inputs.publish_all
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/identity-svc
      image: identity-svc
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  payment-svc:
    needs: changes
    if: needs.changes.outputs.payment == 'true' || needs.changes.outputs.root == 'true' || inputs.publish_all
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/payment-svc
      image: payment-svc
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true' || inputs.publish_all
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_node-service.yml
    with:
      dir: services/web
      image: web
      dockerfile: services/web/Dockerfile
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

  k8s-manifests:
    needs: changes
    if: needs.changes.outputs.k8s == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
          # sha256 of kubeconform-linux-amd64.tar.gz, as published in the release CHECKSUMS file
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Validate manifests (self-test, schema, policy)
        run: |
          bash scripts/k8s-validate.sh --self-test
          # No arguments: platform + every overlay + the real dashboards against metric-names.txt
          bash scripts/k8s-validate.sh
      - name: Trivy config scan
        # Same SHA pin as the Java workflow (tag-hijack incident Mar 2026).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/k8s
          severity: CRITICAL
          exit-code: '1'

  # Full stack on kind (spec 16.3): every push to main, and PRs that touch deploy, scripts or workflows.
  k8s-e2e:
    needs: changes
    if: needs.changes.outputs.k8s == 'true' || needs.changes.outputs.root == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: ./.github/workflows/_k8s-e2e.yml

  # Ops scripts: shellcheck + actionlint + action SHA pins + script tests (no network, no cluster).
  ops-scripts:
    needs: changes
    if: needs.changes.outputs.ops == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck and actionlint
        env:
          SHELLCHECK_VERSION: v0.11.0
          # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.gz, as published with the release asset
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, as published in the release checksums file
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o shellcheck.tar.gz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.gz" | sha256sum -c -
          tar -xzf shellcheck.tar.gz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files 'scripts/**/*.sh' 'scripts/*.sh' 'infra/**/*.sh' 'deploy/k8s/platform/ops/*.sh' scripts/public-url)
          shellcheck --severity=warning "${files[@]}"
      - name: actionlint
        run: actionlint
      - name: Action SHA pins
        run: bash scripts/check-action-pins.sh
      - name: Install kubeseal (pinned in infra/bootstrap/versions.env, sha256-verified)
        run: bash scripts/seal-secrets.sh --install-only
      - name: Script tests
        run: |
          shopt -s nullglob
          for t in scripts/test/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
      - name: Alert rule unit tests (promtool, pinned image)
        run: bash scripts/alerts-promtool.sh

  # Host bootstrap on x86 + ARM runners (k3s, firewall, Sealed Secrets, Argo CD syncing this commit): every push to
  # main, and PRs that touch infra, Argo CD apps, the prod overlay or workflows.
  bootstrap:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.root == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: ./.github/workflows/_bootstrap.yml

  # Single required status check. New services only need to be added to `needs`.
  ci-gate:
    if: always()
    needs: [changes, order-svc, notify-svc, chart-svc, reading-tuvi, identity-svc, payment-svc, web, k8s-manifests, k8s-e2e, ops-scripts, bootstrap]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "ci-gate: FAILED"; exit 1 ;;
          esac
          echo "ci-gate: ok"
