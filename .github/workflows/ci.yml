name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      order: ${{ steps.filter.outputs.order }}
      root: ${{ steps.filter.outputs.root }}
      starter: ${{ steps.filter.outputs.starter }}
      notify: ${{ steps.filter.outputs.notify }}
      chart: ${{ steps.filter.outputs.chart }}
      reading: ${{ steps.filter.outputs.reading }}
      identity: ${{ steps.filter.outputs.identity }}
      payment: ${{ steps.filter.outputs.payment }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            starter:
              - 'libs/java/**'
            order:
              - 'services/order-svc/**'
              - 'contracts/**'
              - 'libs/java/**'
            notify:
              - 'services/notify-svc/**'
              - 'libs/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'deny.toml'
              - 'contracts/**'
            chart:
              - 'services/chart-svc/**'
              - 'libs/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.cargo/**'
              - 'contracts/openapi/chart-svc.yaml'
            reading:
              - 'services/reading-tuvi/**'
              - 'knowledge/**'
              - 'contracts/openapi/reading-tuvi.yaml'
              - 'contracts/openapi/identity-svc.yaml'
              - 'contracts/knowledge/**'
              - 'libs/java/**'
            identity:
              - 'services/identity-svc/**'
              - 'contracts/openapi/identity-svc.yaml'
              - 'contracts/events/payment-succeeded.v1.schema.json'
              - 'libs/java/**'
            payment:
              - 'services/payment-svc/**'
              - 'contracts/openapi/payment-svc.yaml'
              - 'contracts/events/payment-succeeded.v1.schema.json'
              - 'libs/java/**'
            web:
              - 'services/web/**'
            root:
              - 'pom.xml'
              - '.github/**'

  order-svc:
    needs: changes
    if: needs.changes.outputs.order == 'true' || needs.changes.outputs.root == 'true'
    # packages: write is only exercised when publish is true (push to main)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/order-svc
      image: order-svc
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  notify-svc:
    needs: changes
    if: needs.changes.outputs.notify == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_rust-service.yml
    with:
      package: notify-svc
      image: notify-svc
      dockerfile: services/notify-svc/Dockerfile
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  chart-svc:
    needs: changes
    if: needs.changes.outputs.chart == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_rust-service.yml
    with:
      package: chart-svc
      image: chart-svc
      dockerfile: services/chart-svc/Dockerfile
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  reading-tuvi:
    needs: changes
    if: needs.changes.outputs.reading == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/reading-tuvi
      image: reading-tuvi
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  identity-svc:
    needs: changes
    if: needs.changes.outputs.identity == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/identity-svc
      image: identity-svc
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  payment-svc:
    needs: changes
    if: needs.changes.outputs.payment == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_java-service.yml
    with:
      module: services/payment-svc
      image: payment-svc
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_node-service.yml
    with:
      dir: services/web
      image: web
      dockerfile: services/web/Dockerfile
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # Single required status check. New services only need to be added to `needs`.
  ci-gate:
    if: always()
    needs: [changes, order-svc, notify-svc, chart-svc, reading-tuvi, identity-svc, payment-svc, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "ci-gate: FAILED"; exit 1 ;;
          esac
          echo "ci-gate: ok"
