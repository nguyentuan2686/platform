name: k8s-e2e

# Full stack on kind: build the 7 images (read-only from the image-check gha caches), load them into kind, deploy
# deploy/k8s/overlays/e2e and run scripts/k8s-e2e.sh (every smoke script + the observability checks).
# No registry and no push, so it also runs on PRs. Never run kind locally (weak dev machine).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  kind-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KIND_VERSION: v0.32.0
      # sha256 of kind-linux-amd64, as published in the release's kind-linux-amd64.sha256sum
      KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      KUBECTL_VERSION: v1.33.12
      # sha256 of linux/amd64 kubectl, as published at dl.k8s.io/release/<version>/bin/linux/amd64/kubectl.sha256
      KUBECTL_SHA256: fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
      E2E_LOG_DIR: k8s-e2e-diagnostics
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build order-svc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/order-svc/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: order-svc:e2e
          cache-from: type=gha,scope=order-svc-amd64
      - name: Build notify-svc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/notify-svc/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: notify-svc:e2e
          cache-from: type=gha,scope=notify-svc-amd64
      - name: Build chart-svc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/chart-svc/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: chart-svc:e2e
          cache-from: type=gha,scope=chart-svc-amd64
      - name: Build reading-tuvi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/reading-tuvi/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: reading-tuvi:e2e
          cache-from: type=gha,scope=reading-tuvi-amd64
      - name: Build identity-svc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/identity-svc/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: identity-svc:e2e
          cache-from: type=gha,scope=identity-svc-amd64
      - name: Build payment-svc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/payment-svc/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: payment-svc:e2e
          cache-from: type=gha,scope=payment-svc-amd64
      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: web:e2e
          build-args: WEB_ORIGIN=http://localhost:3001
          cache-from: type=gha,scope=web-amd64

      - name: Install kind and kubectl (pinned, sha256 verified)
        run: |
          curl -fsSL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          rm -f kind kubectl
          kind version
          kubectl version --client

      - name: Create kind cluster
        run: kind create cluster --config deploy/k8s/overlays/e2e/kind.yaml --wait 180s

      - name: Load images into kind
        run: |
          for svc in order-svc notify-svc chart-svc reading-tuvi identity-svc payment-svc web; do
            kind load docker-image "${svc}:e2e"
          done

      - name: Deploy, smoke and observability checks
        run: bash scripts/k8s-e2e.sh

      - name: Collect diagnostics
        if: failure() || cancelled()
        run: |
          mkdir -p "$E2E_LOG_DIR"
          d="$E2E_LOG_DIR"
          kubectl get all -A -o wide > "$d/get-all.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$d/events.txt" 2>&1 || true
          kubectl describe pods -n apps > "$d/describe-apps.txt" 2>&1 || true
          for ns in apps data observability; do
            # kubectl logs needs a pod or selector, so one file per pod (plus the previous container after a restart)
            for p in $(kubectl get pods -n "$ns" -o name 2>/dev/null); do
              kubectl logs -n "$ns" "$p" --all-containers --prefix --tail=500 > "$d/logs-$ns-${p#pod/}.txt" 2>&1 || true
              kubectl logs -n "$ns" "$p" --all-containers --prefix --tail=500 --previous \
                > "$d/logs-$ns-${p#pod/}-previous.txt" 2>&1 || true
            done
          done

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-e2e-diagnostics
          path: k8s-e2e-diagnostics/
          if-no-files-found: ignore
