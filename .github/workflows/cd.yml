name: cd

# CD (spec 7): after a green `ci` run for a push to main, bump the prod image tags in
# deploy/k8s/overlays/prod/apps/kustomization.yaml to sha-<commit> for exactly the images published for that commit,
# commit as the CD GitHub App with `[skip ci]` and push to main (CLAUDE.md: the CD bot may push to main only under
# deploy/k8s/overlays/). Argo CD (`prod-apps`, tracks main) rolls the change out.
# Review Focus 1: scripts/cd-bump.sh never moves a tag to an older/unrelated commit; unpublished services keep theirs.
# Security: never checks out or runs code from the triggering run's head; only `main` of this repo is checked out,
# and only for successful `push`/`workflow_dispatch` runs of this repo's main. github.event fields reach shell via env.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main (40 hex) whose published images to deploy
        required: true

# One group per commit, never one global group: GitHub keeps at most one *pending* run per group and cancels the
# older pending one (cancel-in-progress only protects the running run), which would silently drop the deploy of a
# service changed only in the skipped commit. Runs for different commits therefore race; that is safe because a
# rejected push re-runs cd-bump.sh on the new main (3 attempts) and cd-bump.sh never moves a tag backwards, so any
# order converges to the newest tag per service (scripts/test/cd-push.test.sh parallel_runs_converge_in_either_order).
concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      cd: ${{ steps.gate.outputs.cd }}
      verify: ${{ steps.gate.outputs.verify }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Gate on the triggering run and on the CD / verify-deploy secrets
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          # Only "is it set" reaches the shell, never a secret value.
          HAS_CD_APP_ID: ${{ vars.CD_APP_ID != '' }}
          HAS_CD_APP_PRIVATE_KEY: ${{ secrets.CD_APP_PRIVATE_KEY != '' }}
          HAS_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
          HAS_PROD_KUBECONFIG: ${{ secrets.PROD_KUBECONFIG != '' }}
        run: |
          set -euo pipefail
          runbook="see docs/runbooks/go-live.md"
          # feature <name> <NAME...>: prints true (all set) / false (none set, notice) or fails on a partial set.
          feature() {
            local name="$1"; shift
            local set=() missing=() n v
            for n in "$@"; do
              v="HAS_$n"
              if [ "${!v}" = true ]; then set+=("$n"); else missing+=("$n"); fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then echo true; return; fi
            if [ "${#set[@]}" -eq 0 ]; then
              echo "::notice::$name skipped: ${missing[0]} not set ($runbook)" >&2
              echo false; return
            fi
            echo "::error::$name is partially configured: ${set[*]} set but ${missing[*]} not set ($runbook)" >&2
            return 1
          }
          cd="$(feature CD CD_APP_ID CD_APP_PRIVATE_KEY)"
          verify="$(feature verify-deploy TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET PROD_KUBECONFIG)"

          sha=""
          case "$EVENT" in
            workflow_run)
              if [ "$RUN_CONCLUSION" != success ] || { [ "$RUN_EVENT" != push ] && [ "$RUN_EVENT" != workflow_dispatch ]; } \
                || [ "$RUN_HEAD_BRANCH" != main ] || [ "$RUN_HEAD_REPO" != "$REPO" ]; then
                echo "::notice::CD skipped: ci run is not a successful push/dispatch on $REPO main"
                # Run fields can be fork-chosen text: plain log line, never inside a workflow command.
                echo "skipped run: conclusion=$RUN_CONCLUSION event=$RUN_EVENT branch=$RUN_HEAD_BRANCH repo=$RUN_HEAD_REPO"
                cd=false verify=false
              else
                sha="$RUN_HEAD_SHA"
              fi
              ;;
            workflow_dispatch)
              [ "$REF" = refs/heads/main ] || { echo "::error::cd must be dispatched on main, not $REF"; exit 1; }
              sha="$INPUT_SHA"
              ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          if [ -n "$sha" ] && ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be 40 lowercase hex, got '$sha'"; exit 1
          fi
          echo "gate: cd=$cd verify=$verify sha=${sha:-none}"
          {
            echo "cd=$cd"
            echo "verify=$verify"
            echo "sha=$sha"
          } >>"$GITHUB_OUTPUT"

  bump:
    needs: gate
    if: needs.gate.outputs.cd == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      bump_sha: ${{ steps.push.outputs.bump_sha }}
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      KUSTOMIZATION: deploy/k8s/overlays/prod/apps/kustomization.yaml
      SERVICES: order-svc notify-svc chart-svc reading-tuvi identity-svc payment-svc web
    steps:
      - name: CD GitHub App token (contents write on this repo only)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          permission-contents: write
      # Always main of this repo (trusted code), never the triggering run's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: The commit is on main
        run: |
          git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA is not on main"; exit 1; }
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Images published for this commit
        id: published
        run: |
          set -euo pipefail
          list=()
          for s in $SERVICES; do
            ref="ghcr.io/nguyentuan2686/$s:sha-$SHA"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>"$RUNNER_TEMP/inspect.err"; then
              echo "PUBLISHED $s"
              list+=("$s")
            elif grep -qiE 'not found|manifest unknown' "$RUNNER_TEMP/inspect.err"; then
              echo "SKIP $s: not published for $SHA"
            else
              # Registry/auth error: fail (rerun) rather than silently leave a published service undeployed.
              echo "::error::cannot inspect $ref: $(cat "$RUNNER_TEMP/inspect.err")"
              exit 1
            fi
          done
          echo "services=${list[*]}" >>"$GITHUB_OUTPUT"
      - name: Bump tags (never backwards)
        id: bump
        if: steps.published.outputs.services != ''
        env:
          PUBLISHED: ${{ steps.published.outputs.services }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # PUBLISHED is a space-separated list of known service names
          bash scripts/cd-bump.sh --file "$KUSTOMIZATION" --sha "$SHA" $PUBLISHED | tee "$RUNNER_TEMP/bump.out"
          if git diff --quiet; then echo "changed=false" >>"$GITHUB_OUTPUT"; else echo "changed=true" >>"$GITHUB_OUTPUT"; fi
      - name: Install kubeconform
        if: steps.bump.outputs.changed == 'true'
        env:
          KUBECONFORM_VERSION: v0.7.0
          # sha256 of kubeconform-linux-amd64.tar.gz, as published in the release CHECKSUMS file
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          sudo install -m 0755 "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
      - name: Commit and push as the CD App
        id: push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CHANGED: ${{ steps.bump.outputs.changed }}
          PUBLISHED: ${{ steps.published.outputs.services }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bump.out"
          if [ "$CHANGED" != true ]; then
            echo "cd: nothing to push for $SHA"
            { echo "pushed=false"; echo "bump_sha=$(git rev-parse HEAD)"; } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          uid="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Validate the rendered prod overlay and allow exactly one changed file, then commit.
          check_and_commit() {
            bash scripts/k8s-validate.sh deploy/k8s/overlays/prod
            local status
            status="$(git status --porcelain)"
            if [ "$status" != " M $KUSTOMIZATION" ]; then
              echo "::error::CD may change only $KUSTOMIZATION, got: $status"
              exit 1
            fi
            local svcs
            svcs="$(awk '/^BUMP /{print $2}' "$out" | paste -sd, -)"
            git commit -q -a -F - <<MSG
          deploy: ${svcs} to sha-${SHA:0:7} [skip ci]

          $(grep '^BUMP ' "$out")
          MSG
            git log -1 --format='%an <%ae>%n%B'
          }

          check_and_commit
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=true; break; fi
            [ "$attempt" -lt 3 ] || { echo "::error::push to main failed 3 times"; exit 1; }
            echo "push attempt $attempt rejected; re-applying on the new main"
            # Re-run the bump on the new main tip: a newer tag pushed meanwhile is kept (never backwards).
            git fetch -q origin main
            git reset -q --hard origin/main
            # shellcheck disable=SC2086 # PUBLISHED is a space-separated list of known service names
            bash scripts/cd-bump.sh --file "$KUSTOMIZATION" --sha "$SHA" $PUBLISHED | tee "$out"
            if git diff --quiet; then echo "cd: nothing left to do on the new main"; break; fi
            check_and_commit
          done
          { echo "pushed=$pushed"; echo "bump_sha=$(git rev-parse HEAD)"; } >>"$GITHUB_OUTPUT"
      - name: Deployed without verification
        if: steps.push.outputs.pushed == 'true' && needs.gate.outputs.verify != 'true'
        run: |
          echo "::warning::deployed without verification: Tailscale/kubeconfig secrets not set (see docs/runbooks/go-live.md)"

  # Spec 7 CD 3-4: wait for Argo CD to sync the bump, smoke-test through the internal ingress, and on failure revert
  # the bump commit and open an issue. Inside cd.yml (not a separate workflow_run workflow) because only this run knows
  # whether a bump was pushed. Reaches the cluster API over Tailscale (no public ports, spec 11).
  verify-deploy:
    needs: [gate, bump]
    if: needs.bump.outputs.pushed == 'true' && needs.gate.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      BUMP_SHA: ${{ needs.bump.outputs.bump_sha }}
      # Same minor as the prod k3s pin (infra/bootstrap/versions.env K3S_VERSION v1.37.2+k3s1).
      KUBECTL_VERSION: v1.37.2
      # sha256 of linux/amd64 kubectl, as published at dl.k8s.io/release/<version>/bin/linux/amd64/kubectl.sha256
      KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
    steps:
      # Trusted code only: main of this repo (it contains the bump commit), never the triggering run's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # verify-deploy --allow-descendant checks ancestry (and fetches main) here
      - name: Tailscale pin (infra/bootstrap/versions.env)
        id: pins
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . infra/bootstrap/versions.env
          { echo "tailscale_version=$TAILSCALE_VERSION"; echo "tailscale_sha256=$TAILSCALE_SHA256_amd64"; } >>"$GITHUB_OUTPUT"
      - name: Join the tailnet (tag:ci)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: ${{ steps.pins.outputs.tailscale_version }}
          sha256sum: ${{ steps.pins.outputs.tailscale_sha256 }}
      - name: Prod kubeconfig
        env:
          PROD_KUBECONFIG: ${{ secrets.PROD_KUBECONFIG }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$PROD_KUBECONFIG" >"$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >>"$GITHUB_ENV"
      - name: Install kubectl (pinned, sha256 verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          kubectl version --client
      - name: Verify the deploy (Argo CD synced + healthy, smoke via Traefik)
        id: verify
        run: |
          set -uo pipefail
          # Exit 1 = deployed but unhealthy (roll back); 4 = cluster/tailnet not checkable (never roll back).
          bash scripts/verify-deploy.sh --app prod-platform,prod-tunnel,prod-apps --revision "$BUMP_SHA" --allow-descendant \
            2>&1 | tee "$RUNNER_TEMP/verify.out"
          rc="${PIPESTATUS[0]}"
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          exit "$rc"
      - name: CD GitHub App token (contents + issues write on this repo only)
        id: app
        # Success: push the deploy-verified tag. Failure: revert and/or open an issue.
        if: always() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure')
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
      - name: Record the verified deploy (tag deploy-verified)
        id: mark
        # The last verified-good bump: the newest failing run later rolls back to it (scripts/deploy-rollback.sh).
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git clone -q "https://github.com/${REPO}.git" "$RUNNER_TEMP/verified"
          bash scripts/deploy-mark-verified.sh --sha "$BUMP_SHA" --repo "$RUNNER_TEMP/verified" --push
      - name: Roll back (restore the last verified deploy)
        id: rollback
        # Only a deploy that was checked and found unhealthy (exit 1) is reverted, never an unreachable cluster (4).
        if: failure() && steps.verify.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The token reaches git only through env (an http extraheader), never a URL or .git/config on disk.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          # A writable clone of the current main, separate from the trusted checkout the scripts run from.
          git clone -q "https://github.com/${REPO}.git" "$RUNNER_TEMP/rollback"
          uid="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git -C "$RUNNER_TEMP/rollback" config user.name "${APP_SLUG}[bot]"
          git -C "$RUNNER_TEMP/rollback" config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          rc=0
          bash scripts/deploy-rollback.sh --sha "$BUMP_SHA" --repo "$RUNNER_TEMP/rollback" --push --bot "${APP_SLUG}[bot]" \
            >"$RUNNER_TEMP/rollback.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/rollback.out"
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          # 4 = superseded by a newer deploy commit: not an error of this step, the newer run owns the outcome.
          if [ "$rc" = 4 ]; then echo "::notice::rollback skipped: a newer deploy on main owns the outcome (the newest run restores the last verified deploy)"; exit 0; fi
          exit "$rc"
      - name: Open or update a deploy issue
        id: issue
        # Also when verify passed but the deploy-verified tag push failed: a later rollback would go back past this deploy.
        if: failure() && (steps.verify.outcome == 'failure' || steps.mark.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY_RC: ${{ steps.verify.outputs.rc }}
          ROLLBACK_RC: ${{ steps.rollback.outputs.rc }}
          MARK_OUTCOME: ${{ steps.mark.outcome }}
        run: |
          set -euo pipefail
          label=deploy-failed title="deploy failed: sha-${SHA:0:7}"
          case "$MARK_OUTCOME:$VERIFY_RC:$ROLLBACK_RC" in
            failure:*) label=deploy-unrecorded title="deploy verified but not recorded: sha-${SHA:0:7}"
                 result="Verified, but the deploy-verified tag was not moved (deploy-mark-verified.sh failed; see the run log). A later rollback would revert past this good deploy: move the tag by hand (docs/runbooks/go-live.md, Rollback)." ;;
            *:1:0) result="Rolled back: the bump commit was reverted on main; Argo CD syncs the previous tags." ;;
            *:1:3) result="NOT rolled back: the revert conflicted (ROLLBACK: conflict, manual action needed)." ;;
            *:1:4) result="NOT rolled back by this run: a newer deploy commit is on main. The newest CD run owns the outcome: if its verify-deploy fails too, it reverts every deploy since the last verified one (tag deploy-verified), this one included. If that run cannot reach the cluster, it opens a deploy-unverified issue instead and nothing is reverted (manual action)." ;;
            *:1:*) result="NOT rolled back: deploy-rollback.sh failed (rc=${ROLLBACK_RC:-not run}); see the run log." ;;
            *:4:*) label=deploy-unverified title="deploy unverified: prod cluster unreachable"
                 result="NOT rolled back: verify-deploy could not reach the cluster (tailnet, API or port-forward), so the deploy of \`sha-${SHA:0:7}\` is unverified, not known bad." ;;
            *) result="NOT rolled back: verify-deploy did not run to a verdict (rc=${VERIFY_RC:-none}); see the run log." ;;
          esac
          what="verify-deploy failed"
          [ "$MARK_OUTCOME" != failure ] || what="recording the verified deploy failed"
          {
            echo "$what for bump commit \`$BUMP_SHA\` (images \`sha-${SHA:0:7}\`)."
            echo
            echo "- Run: $RUN_URL"
            echo "- $result"
            echo "- Runbook: docs/runbooks/go-live.md (Rollback)"
            echo
            echo "Last 100 lines of verify-deploy:"
            echo
            echo '~~~~'
            tail -n 100 "$RUNNER_TEMP/verify.out" 2>/dev/null || echo "(no verify-deploy output)"
            echo '~~~~'
          } >"$RUNNER_TEMP/issue.md"
          gh label create "$label" --color B60205 --description "CD verify-deploy did not pass" --force
          # One open issue per unreachable episode: later runs comment on it instead of opening more.
          existing=""
          if [ "$label" = deploy-unverified ]; then
            existing="$(gh issue list --label deploy-unverified --state open --json number --jq '.[0].number // empty')"
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --label "$label" --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
