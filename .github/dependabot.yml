version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /services/order-svc
    schedule:
      interval: weekly
    # Java 21 LTS is a platform constraint: JDK/JRE major upgrades go through an ADR, not Dependabot.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: maven
        versions: [">= 3.9-eclipse-temurin-22"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
